<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to tony-pan.com</title>
<meta name="robots" content="noindex">
<!-- Preserve the path so tpypan.github.io/foo lands on tony-pan.com/foo -->
<script>location.replace("https://www.tony-pan.com" + location.pathname + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=https://www.tony-pan.com/"></noscript>
</head>
<body>
<p>This site has moved to <a href="https://www.tony-pan.com/">tony-pan.com</a>.</p>
</body>
</html>
